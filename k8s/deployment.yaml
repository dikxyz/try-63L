apiVersion: apps/v1
kind: Deployment
metadata:
  name: try-gel-deploy
  labels:
    app: try-gel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: try-gel
  template:
    metadata:
      labels:
        app: try-gel
    spec:
      containers:
      - name: web-container
        image: registry-intl.ap-southeast-5.aliyuncs.com/gandes-test/try-gel:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: try-gel-svc
spec:
  type: ClusterIP
  selector:
    app: try-gel
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: try-gel-ingress
  annotations:
    kubernetes.io/ingress.class: alb
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: try-gel-svc
            port:
              number: 80