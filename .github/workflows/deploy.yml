name: CI/CD to Alibaba Cloud ACK

on:
  push:
    branches:
      - main  # Atau ganti dengan nama branch utama Anda (misal: master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Alibaba Cloud ACR
      uses: docker/login-action@v2
      with:
        registry: registry-intl.ap-southeast-5.aliyuncs.com
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: registry-intl.ap-southeast-5.aliyuncs.com/gandes-test/try-gel:${{ github.sha }}

    - name: Set up Kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Update Deployment Image in K8s
      run: |
        # Mengganti tag image di deployment.yaml secara otomatis sesuai commit SHA terbaru
        sed -i 's|image: registry-intl.ap-southeast-5.aliyuncs.com/gandes-test/try-gel:.*|image: registry-intl.ap-southeast-5.aliyuncs.com/gandes-test/try-gel:${{ github.sha }}|g' k8s/deployment.yaml
        
        # Terapkan perubahan ke cluster ACK
        kubectl apply -f k8s/deployment.yaml --validate=false